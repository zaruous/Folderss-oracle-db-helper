# 플러그인 빌드와 릴리스.
# - main 푸시·PR: publish해서 플러그인을 Actions 아티팩트로 올린다 (확인용 — 받은 zip을 그대로 설치)
# - v* 태그 푸시(예: v1.0.0): 태그 버전과 plugin.json의 version이 같은지 확인한 뒤 GitHub 릴리스에 zip을 첨부한다
# 플러그인 폴더 이름을 바꿔도(src/<이름>/) 그대로 동작한다. src 아래 plugin.json은 하나여야 한다.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 태그 빌드에서 릴리스를 만들기 위해 필요

jobs:
  build:
    # WPF 플러그인이지만 csproj의 EnableWindowsTargeting 덕분에 Linux에서도 컴파일된다 (실행은 Windows에서)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 플러그인 찾기
        id: plugin
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(src/*/plugin.json)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::src/*/plugin.json 이 정확히 하나여야 합니다 (찾은 개수: ${#manifests[@]})"
            exit 1
          fi
          manifest="${manifests[0]}"
          dir="$(dirname "$manifest")"
          version="$(jq -r '.version // empty' "$manifest")"
          id="$(jq -r '.id // empty' "$manifest")"
          if [ -z "$id" ]; then
            echo "::error::$manifest 에 id가 없습니다"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "플러그인: $id $version ($dir)"

      - name: 태그와 plugin.json 버전 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.plugin.outputs.version }}" ]; then
            echo "::error::태그 버전($tag)과 plugin.json version(${{ steps.plugin.outputs.version }})이 다릅니다. plugin.json을 고친 뒤 다시 태그하세요."
            exit 1
          fi

      # 지침 예제 시험(GuideExamplesTests)이 make_template.py·check_template.py를 실제로 돌린다 — 없으면 그 시험만 건너뛴다
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 지침 예제 시험 준비(openpyxl)
        run: pip install openpyxl

      - name: 테스트
        run: dotnet test tests/MyPlugin.Tests -c Release --nologo

      - name: publish
        run: dotnet publish "${{ steps.plugin.outputs.dir }}" -c Release --nologo

      - name: zip 찾기
        id: zip
        shell: bash
        run: |
          shopt -s nullglob
          zips=("${{ steps.plugin.outputs.dir }}"/bin/Release/net8.0-windows/win-x64/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::플러그인 zip을 찾지 못했습니다"
            exit 1
          fi
          # 릴리스 파일 이름: <id>-<version>.zip
          out="${{ steps.plugin.outputs.id }}-${{ steps.plugin.outputs.version }}.zip"
          cp "${zips[0]}" "$out"
          unzip -l "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # 아티팩트는 GitHub가 한 번 더 zip으로 감싼다 — zip을 그대로 올리면 받은 파일 맨 위에 plugin.json이 없어 설치되지 않는다.
      # 풀어서 내용을 올리면 받은 아티팩트 zip이 곧 플러그인 zip이다(맨 위에 plugin.json).
      - name: 아티팩트용으로 풀기
        shell: bash
        run: |
          rm -rf artifact
          unzip -q "${{ steps.zip.outputs.path }}" -d artifact
          test -f artifact/plugin.json || { echo "::error::zip 맨 위에 plugin.json이 없습니다"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plugin.outputs.id }}-${{ steps.plugin.outputs.version }}
          path: artifact/

      - name: GitHub 릴리스
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # 웹에서 [Draft a new release]로 태그를 만들면 릴리스가 이미 있다 — 그때는 zip만 그 릴리스에 올린다(같은 이름이면 바꿈)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
