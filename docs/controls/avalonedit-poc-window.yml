id: avalonedit-poc-window
name: AvalonEditPocWindow
title: AvalonEdit PoC 창 (시험판)
kind: window
source:
  - src/MyPlugin/Ui/AvalonEditPocWindow.cs
  - src/MyPlugin/Ui/SqlEditorHighlighting.cs
base: System.Windows.Window
used_by: [sql-workspace, shell-menu]
summary: >-
  [시험판 전용 — main에 들어 있음(PR #24), 3단계 교체 뒤 지운다] 도구 > AvalonEdit PoC로 여는 편집기 실측 창.
  지금 SQL 탭의 글과 대상 DB 규칙을 가져와 AvalonEdit으로 보이고 주석·문자열·키워드를 칠한다. 본 SQL 탭은 바꾸지 않는다.
features:
  - name: 편집기
    description: >-
      AvalonEdit TextEditor(줄 번호, 고정폭 글꼴, 하이퍼링크 끔). 강조는 SqlEditorHighlighting(4단계 SqlEditor가 그대로 쓸 것)이 붙인다 —
      SqlScript.EditorSpans(주석·문자열·키워드), 글이 바뀌면 SqlHighlighter가 바뀐 곳 근처만 다시 계산, 2만 자 넘는 줄은 칠하지 않음.
  - name: 규칙 콤보 (PocRules)
    description: "Oracle·PostgreSQL·SQL Server — 문장 나누기와 같은 규칙, 키워드 목록도 DBMS마다 다르다. 바꾸면 처음부터 다시 칠한다."
  - name: 방식 콤보 (PocMode)
    description: "[증분 강조](기본) / [전체 다시 계산(비교용)] — 글이 바뀔 때마다 문서 전체를 다시 계산·다시 그리는 첫 PoC 방식과 비교."
  - name: 시험 데이터
    description: >-
      [D1 경계 사례]·[D2 실무형 1천 줄]·[D3-1 1만 줄]·[D3-2 5만 줄]·[D3-3 10만 줄]·[D4-1 한 줄 1MB]·[D4-2 맨 앞 /* 넣기·빼기]·[D4-3 전부 주석 10만 줄]
      (계획서 5절 구성으로 생성).
  - name: 실측 표시
    description: >-
      넣기→첫 화면 시간, 강조 계산 시간(증분: 다시 훑은 글자·다시 칠한 범위, 전체: 글 꺼내기 + 계산)과 이번 글의 중앙값·최대,
      최근 키 8개와 편집기가 처리했는지(Handled) 통과했는지. [결과 복사]는 계획서 7절 표 형식 줄로 클립보드에.
theme:
  - part: 편집기 바탕·글자·테두리·줄 번호·선택
    keys: [PanelBackground, PrimaryText, BorderBrush, SecondaryText, SelectionBrush]
  - part: 주석 / 문자열 / 키워드 (SqlHighlightLogic.Palette가 테마 색에서 계산 — 바탕 대비 4.5:1, 주석과 본문 구분)
    keys: [PanelBackground, PrimaryText, SecondaryText, AccentBrush]
limits:
  - 시험판 전용이다. 3단계(SQL 탭 편집기 교체)가 끝나면 창과 도구 메뉴 항목을 지운다.
  - 저장·실행·찾기·SQL 탭 단축키는 없다(키가 편집기에서 처리되는지만 본다).
  - PostgreSQL 함수 본문 $$ … $$는 통째로 문자열색이다(문장 나누기와 같은 기준).
  - 창 아래 실측 글을 키마다 고치므로 이 창의 키 입력 시간에는 그 글 배치가 들어간다(헤드리스 성능 측정은 창 없이 SqlEditorHighlighting만 붙인 편집기로 잰다).
verification:
  - Linux에서 빌드·publish zip에 ICSharpCode.AvalonEdit.dll·.deps.json 등록까지 확인.
  - 2026-10-21 Windows 헤드리스(tests/MyPlugin.UiTests/EditorPocHeadlessTests.cs)로 계획서 4절 A·B·D·E 실측 — 도구 메뉴로 열기, 플러그인 로드 컨텍스트, 그리기·색칠, 시험 데이터 버튼, 창 아래 실측 글, 테마 7종 캡처.
  - 2026-10-21 키워드 색(세 DBMS 47곳 — 문자열·주석·식별자·t.date·:from·@from 함정 포함), 데이터별 성능(증분·전체·강조 없음·TextBox), 테마 변경 즉시 반영. 한글 IME(C)는 사람이 확인해야 한다.
related: [sql-workspace, shell-menu]
