id: check-window
name: CheckWindow
title: 일일 점검 창
kind: window
source:
  - src/MyPlugin/Ui/CheckWindow.cs
  - src/MyPlugin/Ui/CheckLogic.cs
  - src/MyPlugin/Db/MonitorStore.cs
  - src/MyPlugin/Db/Providers/IMonitorProvider.cs
  - src/MyPlugin/Db/Providers/OracleMonitor.cs
  - src/MyPlugin/Doc/CheckReportModel.cs
  - src/MyPlugin/Doc/CheckReportTemplate.cs
used_by: [db-helper-view, shell-menu, overview-window]
summary: >-
  도구 > 일일 점검…(또는 전체 DB 상태의 [일일 점검…])으로 여는 창(모달 아님, DB Helper 창마다 하나). 고른 DB들에 점검 묶음을 돌려
  항목마다 정상·정보·주의·위험·건너뜀·오류와 값, 직전 대비를 보이고, 고른 항목의 판정 기준·조치·발견 행을 아래에 보인다. 엑셀 보고서로 저장한다.
features:
  - name: 점검 계약
    description: >-
      IDbProvider.Monitor.CheckSet(MonitorCheckSet) — 서버 식별 SQL(IDENTITY·LABEL) + 항목(MonitorCheck — id·분류·제목·SQL·규칙·필요 권한·필요 조건·조치).
      규칙은 AnyRow(행이 있으면 주의/위험) · Threshold(열 최댓값과 주의·위험 문턱, 값이 없을 때 단계) · ByLevel(판정 열의 OK·WARN·CRIT) · Info.
      지금은 Oracle만(17개 — 인스턴스·로그 모드·아카이브 대상·테이블스페이스(최대 기준)·FRA·마지막 백업·실패 백업·경고 로그·로그 스위치·
      INVALID·UNUSABLE·오래된 통계·실패 작업·DBMS_JOB·오래 실행 세션·잠금 대기·비밀번호 만료). PostgreSQL·SQL Server는 "지원 예정"으로 고를 수 없다.
  - name: 실행
    description: >-
      CheckRunner — DB마다 점검 전용 세션(성능 모니터와 같은 경로로 열고, 비밀번호가 없으면 묻는다 — 한 번에 하나씩)에서 항목을 차례로.
      DB는 동시 4개. 필요 조건이 안 맞으면 건너뜀(이유), 권한 오류면 건너뜀(필요 권한), 항목마다 60초 시간 제한(넘으면 오류), 하나가 실패해도 계속.
      항목 하나가 끝날 때마다 그 줄을 고친다(아직 안 돈 항목은 "대기"). [취소]는 남은 항목을 멈추고 그 DB는 기록하지 않는다.
  - name: 결과 목록
    description: >-
      DB마다 머리(배지 · 서버가 알려 준 DB 이름 · 요약 · 걸린 시간 · 직전 점검 시각, 접속 실패면 "점검 못 함"과 이유)와 분류별 항목 줄 —
      상태 칩 · 제목(사용자 항목은 "(사용자)") · 값 요약(건너뜀·오류는 이유) · 직전 대비(처음 · 같음 · ↑ 나빠짐 · ↓ 좋아짐) · 걸린 시간.
      줄을 누르면(Enter·Space) 아래 상세. 창 머리에 전체 요약("DB 2개 · 접속 실패 1 · 주의 2 · 건너뜀 1 · 정상 14").
  - name: 상세
    description: >-
      상태 칩 · DB · 분류 · 제목, 값 · 판정 기준 · 직전 상태와 값 · 필요 권한 · 걸린 시간 · id, 조치(주의·위험) 또는 이유(건너뜀·오류),
      [SQL 보기]·[SQL 복사], 발견 행 결과 그리드(최대 100행 — 1,000행까지 세고 판정, 셀 복사·행 복사).
  - name: 기록과 직전 대비
    description: >-
      history.db(플러그인 데이터 폴더 monitor-history)에 항목별 상태·값·행 수·이유 분류만 남긴다(발견 행은 남기지 않는다). DB 키는 서버 식별(Oracle DBID+이름)의
      SHA-256이라 접속 이름을 바꿔도 이력이 이어진다. 같은 DB의 직전 실행과 건강 단계(정상·정보 < 주의 < 위험)를 비교한다. 설정 "성능 모니터"에서 기록을 끄면 남기지 않고,
      점검이 끝날 때 보관 기간(기본 90일)이 지난 실행을 지운다. 파일을 열 수 없으면 기본 항목만 돌리고 창 아래에 이유를 보인다(더 새 버전 파일이면 읽기만).
  - name: 엑셀로 저장
    description: >-
      기본 양식(요약 시트 — DB별 상태 수·가장 나쁜 상태 색·주의 이상 항목, DB마다 시트 — 항목 표 상태별 줄 색·발견 사항 칸별)을 ExcelTemplate로 그린다.
      [양식 ▾] — 기본 양식 · 내 양식 고르기(.xlsx, monitor.check.template) · 기본 양식을 파일로 저장(고쳐 쓰기용, _변수 설명 시트 포함).
      저장만 하고 열지 않는다(저장 뒤 [열기]). 마지막 폴더는 monitor.check.folder.
  - name: 대상 DB
    description: >-
      왼쪽 목록에 저장한 접속 전부(점검을 지원하지 않는 DBMS는 꺼짐). 처음에는 저장된 비밀번호가 있는 접속을 고르고, 그 뒤로는 마지막에 고른 것(monitor.check.dbs).
      [모두]·[없음]. 점검하는 동안은 바꿀 수 없다.
keyboard:
  - keys: F5
    action: 점검 실행.
  - keys: Esc
    action: 닫기(점검 중이면 무시).
  - keys: Enter / Space
    action: 포커스가 있는 항목 줄의 상세.
theme:
  - part: 창·목록·상세
    keys: [WindowBackground, PanelBackground, PrimaryText, SecondaryText, BorderBrush, SelectionBrush, AccentBrush]
  - part: 상태 칩·직전 대비·기록 경고
    keys: [Theme.Danger, Theme.Warning, Theme.Success]
states:
  - 대상을 고르지 않았으면 [점검 실행]이 안내 창을 띄운다. 결과가 없으면 [엑셀로 저장…]은 꺼짐.
  - 점검 중에는 머리 요약이 "점검 중… (1/2 DB)"이고 [점검 실행]이 꺼지며 [취소]가 켜진다.
limits:
  - 임계값·켬끔 덮어쓰기는 지금 화면에서 전체('')만 고친다(저장소는 DB별도 받는다).
  - 창이 닫혀 있으면 정해진 시각에 저절로 돌지 않는다(예약 실행 없음).
  - Data Guard 지연 항목은 스탠바이 실측 환경이 없어 아직 없다. 11g~12.1의 경고 로그는 SYS가 따로 권한을 줘야 돈다(그 전에는 건너뜀).
verification: >-
  2026-10-20 헤드리스 시험 호스트(플러그인만 숨은 데스크톱에)에서 Oracle 11.2 XE(SELECT_CATALOG_ROLE 계정)와 닫힌 포트 접속으로 실행 —
  17개 항목 중 주의 2(NOARCHIVELOG, RMAN 기록 없음 "값 없음"), 건너뜀 1(경고 로그 ORA-00942 → 필요 권한 안내), 정상 14, 닫힌 포트는 "점검 못 함 ORA-12541".
  플러그인 로드 컨텍스트가 e_sqlite3.dll을 불러 history.db에 실행 1건·결과 17건(발견 행 없음)을 남김, 두 번째 실행에서 직전 시각과 "같음",
  파일 저장 대화상자로 엑셀 저장 → 요약·XE-dba·XE-down 시트와 건너뜀 이유 확인, 화면 캡처로 모양 확인.
tests:
  - tests/MyPlugin.Tests/CheckLogicTests.cs
  - tests/MyPlugin.Tests/CheckRunnerTests.cs
  - tests/MyPlugin.Tests/CheckReportTests.cs
  - tests/MyPlugin.Tests/MonitorStoreTests.cs
  - tests/MyPlugin.UiTests/CheckHeadlessTests.cs
related: [check-items-dialog, monitor-settings-page, overview-window, monitor-window, result-grid, shell-menu]
