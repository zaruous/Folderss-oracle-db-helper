id: connection-settings-page
name: ConnectionSettingsPage
title: 설정 창 DB 접속 탭
kind: settings-page
source:
  - src/MyPlugin/ConnectionSettingsPage.cs
base: Folderss.PluginContract.IPluginSettingsPage
summary: >-
  Folderss 설정 창의 "DB 접속" 탭. 저장된 접속 목록(읽기 전용)과 [접속 관리 열기].
features:
  - name: 목록
    description: 저장된 접속을 읽기 전용으로 보인다. 보이는 동안만 접속 목록 변경 알림을 받아 새로 그린다.
  - name: 접속 관리 열기
    description: 편집은 접속 관리 창에서만 한다(두 곳에서 편집하면 나중에 저장한 쪽이 덮어쓰므로).
  - name: 저장
    description: 접속 관리 [저장] 때 이미 저장하므로 설정 창 저장에서는 쓰는 것이 없다.
theme:
  - part: 목록·글자
    keys: [PanelBackground, PrimaryText, SecondaryText]
related: [connection-manager]
