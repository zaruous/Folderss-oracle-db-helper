id: date-time-box
name: DateTimeBox
title: 날짜·시각 입력
kind: control
source:
  - src/MyPlugin/Ui/DateTimeBox.cs
  - src/MyPlugin/Ui/RowEditLogic.cs
base: System.Windows.Controls.DockPanel
used_by: [row-edit-dialog]
summary: >-
  이 플러그인 전용 날짜·시각 입력. 글 칸(값의 원본) + 📅 버튼 + 팝업(달력·시각·오늘·지금).
  WPF 기본 Calendar·DatePicker는 템플릿에 색이 고정돼 테마를 입힐 수 없어 직접 그린다.
features:
  - name: 글 칸
    description: >-
      값은 그리드 표시 형식 "yyyy-MM-dd HH:mm:ss[.fffffff]" 글자다. 팝업이 못 다루는 값(TIMESTAMP 나노초 등)도 손으로 넣을 수 있다.
      값 검사는 이 컨트롤이 하지 않고 편집 창 [확인]이 한다.
  - name: 팝업 열기
    description: >-
      📅 또는 글 칸에서 Alt+↓. 달력은 칸의 날짜가 든 달(읽을 수 없으면 이번 달), 시각 칸은 칸의 시각(없으면 00:00:00).
  - name: 달력
    description: >-
      ◀◀ 1년 · ◀ 1달 · "yyyy년 M월" · ▶ 1달 · ▶▶ 1년. 일요일부터 6주(42일)를 보이고 다른 달 날짜는 흐리게.
      오늘은 밑줄, 고른 날은 선택색 바탕 + 강조색 2px 테두리 + 굵게.
  - name: 날짜 고르기
    description: 날짜를 누르면 그 날짜 + 시각 칸을 합쳐 글 칸에 넣고 닫는다. 초 미만이 있으면 소수점까지 유지한다.
  - name: 오늘 · 지금
    description: "[오늘]은 날짜만 오늘로 고른다(시각 그대로, 닫지 않음). [지금]은 지금 날짜·시각을 넣고 닫는다."
  - name: 시각 검사
    description: >-
      HH:mm, HH:mm:ss, HH:mm:ss.fffffff(24시간제, 24:00 이상 거부).
      틀리면 팝업 안에 "⚠ 시각 형식이 아닙니다"를 보이고 닫지 않는다.
  - name: Picked 이벤트
    description: 팝업에서 값을 넣었을 때 올린다. 행 편집 창은 이때 NULL 체크를 푼다.
keyboard:
  - keys: Alt+↓
    action: 글 칸에서 팝업 열기.
  - keys: Enter
    action: 시각 칸에서 [확인].
  - keys: Esc
    action: 시각 칸에서 닫기.
theme:
  - part: 팝업 바탕
    keys: [SurfaceBackground]
  - part: 팝업 가장자리
    keys: [DisabledTextBrush]
  - part: 날짜·이동·[오늘]·[지금]·[확인] 버튼
    keys: [ControlBackground, ControlHoverBrush, ControlPressedBrush, BorderBrush, PrimaryText]
  - part: 다른 달 날짜·요일·"시각" 이름
    keys: [SecondaryText]
  - part: 고른 날
    keys: [SelectionBrush, AccentBrush]
  - part: "[확인] 테두리"
    keys: [AccentBrush]
  - part: 시각 오류
    keys: [PrimaryText, Theme.Danger (⚠만)]
states:
  - 오늘은 밑줄과 "오늘" 툴팁, 고른 날은 선택색 + 강조 테두리 + 굵게(둘이 겹쳐도 구분됨).
limits:
  - 날짜 사이를 화살표 키로 옮기지 않는다(마우스·Tab).
  - 요일은 일요일 시작, 머리 글은 한국어 고정이다(PC 지역 설정을 따르지 않음).
  - 팝업을 열 때마다 새로 만들어 지난번에 보던 달을 기억하지 않는다.
  - 시간대 있는 형식·INTERVAL에는 쓰지 않는다(그 칸은 편집 불가).
verification:
  - >-
    Folderss 테마 7종(Black·Light·Catppuccin·Dracula·GitHub·Nord·Solarized)의 실제 색으로 WCAG 대비를 재서
    고른 날 테두리 3.1 이상, 오류 글 8.7 이상, 팝업 가장자리 2.0~3.9를 확인했다(Windows 화면 확인은 아님).
tests:
  - tests/MyPlugin.Tests/RowEditLogicTests.cs
related: [row-edit-dialog, theme]
