id: db-helper-view
name: DbHelperView
title: DB Helper 창
kind: composite
source:
  - src/MyPlugin/Ui/DbHelperView.cs
base: System.Windows.Controls.Grid
summary: >-
  Folderss의 ⋯ 메뉴 > 플러그인 > DB Helper로 여는 팝업 창 전체.
  위 메뉴·아이콘 막대, 왼쪽 DB 트리, 오른쪽 SQL 작업 영역을 담고, 접속마다 세션 하나를 연다.
features:
  - name: 화면 배치
    description: >-
      맨 위 메뉴 막대와 아이콘 막대, 그 아래 왼쪽 DB 트리와 오른쪽 SQL 작업 영역.
      둘 사이 분할선은 평소에 보이지 않고 마우스를 올리면 강조색이 된다.
  - name: 접속별 세션
    description: >-
      DB(접속)마다 세션을 하나 연다. 같은 DB를 대상으로 하는 탭들은 트랜잭션을 함께 쓴다.
      같은 DB를 동시에 두 번 연결하지 않고, 끊긴 세션은 버리고 다시 연결한다.
  - name: 연결 중 접속 정보 사본
    description: >-
      연결한 동안에는 연결할 때의 접속 정보 사본으로 이름·색·확인 창·읽기 전용 검사를 한다.
      저장 값이 바뀌면 다시 연결할 때 적용한다(읽기 전용을 켠 것만 바로 적용).
  - name: 연결·다시 연결·끊기
    description: >-
      끊기는 실행 중이면 막고, 커밋 대기 변경이 있으면 커밋·롤백을 묻는다.
      다시 연결은 끊은 뒤 저장된 접속 정보로 연결한다.
  - name: 커밋·롤백
    description: 지금 SQL 탭 대상 DB의 세션 전체(같은 DB의 모든 탭)에 적용한다.
  - name: 창 닫기
    description: >-
      실행을 취소하고, 커밋 대기가 있는 DB마다 커밋·롤백을 묻는다.
      하나라도 돌아가기를 고르면 닫지 않는다. 그다음 세션을 모두 닫는다.
  - name: 정의서 창 열기
    description: >-
      테이블 정의서·GCM 정의서 창은 연결이 없으면 연결하고, 그 DB에서 실행 중이면 알리고 열지 않는다(세션을 같이 쓰므로).
      테이블 정보(F4)·테이블 정의서는 Oracle만 지원하고 다른 DBMS면 안내한다.
  - name: 성능 모니터 창 열기
    description: >-
      DB마다 창 하나(monitor-window)를 연다(같은 DB면 있는 창을 앞으로). 창은 모니터 전용 세션을 따로 열므로(OpenMonitorSessionAsync — 저장된 비밀번호,
      없으면 묻기) 트리에서 연결하지 않아도 되고 SQL 탭 실행과 서로 기다리지 않는다. 이 창을 닫으면 모니터 창과 그 세션도 닫는다.
      공급자에 모니터 섹션이 없으면(Generic) 안내한다.
keyboard:
  - keys: Ctrl+N
    action: 새 SQL 탭
  - keys: Ctrl+O
    action: SQL 파일 열기
  - keys: Ctrl+S
    action: 저장
  - keys: Ctrl+Shift+S
    action: 다른 이름으로 저장
  - keys: Ctrl+W
    action: 탭 닫기
  - keys: F5
    action: 스크립트 실행(편집기 전체)
theme:
  - part: 분할선(마우스를 올렸을 때)
    keys: [AccentBrush]
states:
  - 연결 중·실행 중·커밋 대기는 트리 배지와 아이콘 막대의 켬·끔으로 보인다.
limits:
  - 테이블 정보(F4)·테이블 정의서는 Oracle 데이터 사전 기반이라 PostgreSQL·SQL Server에서는 안내만 한다.
tests:
  - tests/MyPlugin.Tests/ShellLogicTests.cs
related: [shell-menu, db-tree-panel, sql-workspace]
