id: help-window
name: HelpWindow
title: 도움말 창
kind: window
source:
  - src/MyPlugin/Ui/HelpWindow.cs
  - src/MyPlugin/Ui/HelpLogic.cs
  - src/MyPlugin/help/index.html
used_by: [shell-menu]
summary: >-
  플러그인 폴더의 help\*.html을 WebBrowser로 보이는 창(모달 아님).
  같은 소유 창에 이미 열려 있으면 그 창에서 페이지만 바꾼다.
features:
  - name: 페이지
    description: 시작 페이지(단축키 표 포함), 접속, 테이블 정의서, GCM 정의서.
  - name: 아래 버튼
    description: "[브라우저에서 열기]·[닫기]. 도움말 폴더를 모르면 온라인 사본을 연다."
keyboard:
  - keys: Esc
    action: 닫기.
theme:
  - part: 창 테두리·버튼
    keys: [WindowBackground, PrimaryText]
limits:
  - HTML 안의 색은 help.css가 정하고 Folderss 테마를 따르지 않는다.
tests:
  - tests/MyPlugin.Tests/HelpTests.cs
related: [shell-menu]
