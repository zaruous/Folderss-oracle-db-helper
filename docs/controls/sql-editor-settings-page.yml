id: sql-editor-settings-page
name: SqlEditorSettingsPage
title: 설정 창 SQL 편집기 탭
kind: settings-page
source:
  - src/MyPlugin/SqlEditorSettingsPage.cs
  - src/MyPlugin/Ui/SqlEditorSettingsLogic.cs
  - src/MyPlugin/Ui/SqlEditorSetup.cs
base: Folderss.PluginContract.IPluginSettingsPage
summary: >-
  Folderss 설정 창의 "SQL 편집기" 탭 — Folderss 설정에는 없는 SQL 편집기 전용 설정(SqlEditorSettings, 플러그인 설정 키 sqlEditor.settings에 JSON).
  지금은 도구 › AvalonEdit PoC 창에 적용되고, SQL 탭 편집기를 AvalonEdit으로 바꾸는 3단계부터 SQL 탭에도 적용된다.
features:
  - name: 표시
    description: >-
      줄 간격(sqleditor-line-height — 글꼴 기본(13에서 15px) 또는 16~32px, 19px는 지금 SQL 탭과 같음; AvalonEdit에는 줄 간격 속성이 없어
      SqlEditorSetup이 같은 글꼴을 가리키는 합성 글꼴의 LineSpacing으로 정한다)와 칠하지 않을 긴 줄 기준(sqleditor-max-line — 기본 20,000자, 1,000~1,000,000).
  - name: 구문 강조
    description: >-
      키워드·자료형·문자열·주석마다 칠함(sqleditor-style-{kind}-enabled)·색(-color, #RRGGBB, 비우면 테마 색 — 자료형은 키워드와 같은 색)·굵게(-bold)·기울임(-italic)과
      지금 테마 바탕 대비 명암비(-contrast, 4.5:1 미만이면 "읽기 어려움").
  - name: 키워드 대상
    description: 더 칠할 낱말(sqleditor-extra-keywords — 키워드 색으로)과 칠하지 않을 낱말(sqleditor-excluded-keywords — 기본 키워드·자료형에서 뺌). 세 DBMS 모두에 적용. 기본 목록 개수 표시.
  - name: 미리 보기
    description: >-
      규칙 콤보(sqleditor-preview-rules)와 AvalonEdit 미리 보기(sqleditor-preview) — 칸을 고치는 대로 바로 보인다(저장 전). 화면에 붙어 있는 동안만 강조·테마 감시를 연결한다.
  - name: 저장·되돌리기
    description: >-
      설정 창 [저장]에서 쓰고 SqlEditorSettings.Changed로 열린 편집기에 바로 알린다. 잘못 적은 칸은 오류 글(sqleditor-error)과 저장 실패(예외 → 설정 저장 실패 메시지).
      [기본값으로 되돌리기](sqleditor-reset)는 칸만 기본값으로(저장은 [저장]).
theme:
  - part: 글자·보조 글자·미리 보기 바탕·줄 번호·선택
    keys: [PrimaryText, SecondaryText, PanelBackground, BorderBrush, SelectionBrush]
  - part: 명암비 계산(테마 색)
    keys: [PanelBackground, PrimaryText, SecondaryText, AccentBrush]
  - part: 오류 글·낮은 명암비
    keys: [Theme.Danger]
limits:
  - 줄 간격은 미리 정한 값에서 고른다(Folderss 콤보 스타일은 편집 칸이 없음).
  - 더 칠할·칠하지 않을 낱말은 DBMS를 가리지 않는다.
verification:
  - 단위 테스트 SqlEditorSettingsTests(기본값·저장 형식 왕복·깨진 값은 그 항목만 기본값·입력 검사).
  - 2026-10-21 헤드리스 S_SettingsPage_AppliesToEditor — 줄 간격 19px·키워드 색·굵게·주석 끔·NVL 더함·DATE 뺌·긴 줄 5,000자가 미리 보기와 저장 뒤 열린 PoC 창에 바로 반영, 범위 밖 값 저장 실패, 기본값으로 되돌리기.
related: [avalonedit-poc-window, monitor-settings-page]
