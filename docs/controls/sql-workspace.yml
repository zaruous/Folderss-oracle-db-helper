id: sql-workspace
name: SqlWorkspace
title: SQL 작업 영역
kind: composite
source:
  - src/MyPlugin/Ui/SqlWorkspace.cs
  - src/MyPlugin/Ui/SqlWorkspaceTab.cs
  - src/MyPlugin/Ui/SqlWorkspaceParts.cs
  - src/MyPlugin/Ui/WorkspaceLogic.cs
  - src/MyPlugin/Ui/EditorLogic.cs
  - src/MyPlugin/Ui/SqlFileLogic.cs
  - src/MyPlugin/Ui/SqlDraftLogic.cs
base: System.Windows.Controls.Grid
used_by: [db-helper-view]
summary: >-
  오른쪽 영역 전체. SQL 탭(탭마다 대상 DB)과 편집기, 결과 칸(결과·메시지·기록), 상태줄.
  화면은 XAML 없이 코드로 만들고 색은 테마 키에 연결한다.
features:
  - name: SQL 탭
    description: >-
      탭마다 편집기를 따로 두어 글·캐럿·선택·스크롤·되돌리기 기록이 탭별로 남는다.
      파일 탭은 파일 이름, 고친 탭은 이름 뒤 *, 다른 탭에서 실행이 끝나면 ●. 탭 줄 오른쪽에 대상 DB 콤보·실행·취소 버튼.
      탭이 넘치면 스크롤바 없이(탭 줄 높이 고정) 휠로 가로 스크롤하고, 탭 줄 끝의 ▾(SQL 탭 목록)로 탭을 골라 옮긴다.
      탭 머리 오른쪽 클릭: 닫기 · 다른 탭 모두 닫기 · 왼쪽 탭 모두 닫기 · 오른쪽 탭 모두 닫기
      (앞에서 뒤로 닫음, 실행 중인 탭은 건너뜀, 저장 묻기에서 [취소]하면 남은 탭은 그대로, 끝나면 메뉴를 연 탭으로).
  - name: 편집기
    description: >-
      고정폭 글꼴, 줄 높이를 고정한 줄 번호 칸. 파일을 끌어다 놓으면 그 파일 탭으로 연다.
      줄 주석 토글, 대·소문자 바꾸기, 커서 위치 이름의 테이블 정보(F4).
  - name: 실행
    description: >-
      커서가 있는 문장 또는 선택 영역을 실행한다. 선택 영역에 문장이 여럿이거나 스크립트 실행이면 차례로 실행하고
      조회마다 결과 하위 탭(최대 20개)을 만든다. 오류가 나면 그 문장에서 멈춘다.
      위험한 문장·커밋 대기 중 DDL은 시작 전에 확인 창, 읽기 전용 접속은 조회만 허용.
  - name: 결과 칸
    description: >-
      [결과]·[메시지]·[기록] 머리 버튼(개수 표시)과 [복사(TSV)].
      결과가 둘 이상이면 결과 하위 탭 막대가 보인다(넘치면 SQL 탭 줄처럼 휠 스크롤·▾ 조회 결과 목록). 빠른 조회 결과에는 결과 편집 막대가 붙는다.
  - name: 이어 읽기
    description: >-
      처음 가져온 뒤 상태줄의 [다음 행 가져오기]로 같은 커서에서 이어 읽는다(다시 조회하지 않음).
  - name: 빠른 조회(트리 F1)
    description: >-
      그 DB 탭에서 앞 100행을 조회한다. 편집기 글은 그대로 두고 실행 기록에는 남는다.
      조회 전에 데이터 사전에서 기본 키 열을 읽어 결과 편집 대상을 정한다.
  - name: SELECT 넣기
    description: >-
      트리 메뉴·Enter: 그 DB 대상 탭(없으면 새 탭)으로 옮겨 편집기 맨 위에 SELECT 문을 넣는다.
  - name: 파일과 임시 저장
    description: >-
      열기(여러 개)·저장·다른 이름으로 저장, 원래 인코딩(UTF-8·BOM·UTF-16·CP949)과 줄바꿈 유지.
      입력이 멈춘 뒤 1.5초와 탭·창을 닫을 때 쓰던 탭을 임시 저장하고 다음에 되살린다.
  - name: 상태줄
    description: >-
      행 수·걸린 시간·더 있음, 실행 중 경과 시간, 오류 안내와 동작 버튼([연결]·[다시 연결]·[다음 행 가져오기]).
keyboard:
  - keys: Ctrl+Enter
    action: 커서가 있는 문장 또는 선택 영역 실행.
  - keys: F5
    action: 스크립트 실행(편집기 전체).
  - keys: Ctrl+/
    action: 줄 주석 토글(되돌리기 한 번으로 돌아감).
  - keys: Ctrl+Shift+U / Ctrl+Shift+L
    action: 선택 영역 대문자 / 소문자.
  - keys: F4
    action: 커서가 있는 테이블 이름의 정보.
  - keys: Ctrl+F · F3 / Shift+F3
    action: 편집기·결과 찾기 팝업 열기 · 다음 / 이전(find-bar).
  - keys: Ctrl+C
    action: 결과 그리드에서 선택한 행 복사(TSV).
theme:
  - part: 편집기·결과 바탕
    keys: [PanelBackground, PrimaryText]
  - part: 탭 줄·결과 머리·상태줄
    keys: [SurfaceBackground, BorderBrush, SecondaryText]
  - part: 고른 탭·결과 머리 밑줄
    keys: [AccentBrush]
  - part: 실행 버튼(주 동작)
    keys: [AccentBrush, PanelBackground]
  - part: 실행 중 표시
    keys: [Theme.Warning]
states:
  - 탭 머리의 * 는 저장하지 않은 파일 변경, ● 는 다른 탭을 보는 동안 끝난 실행.
  - 실행 중에는 실행 버튼·대상 콤보가 꺼지고 취소 버튼이 켜진다.
  - SQL 탭 줄·결과 하위 탭 막대의 ▾는 탭이 넘칠 때만 보인다. ▾ 목록에서 지금 탭은 굵게.
limits:
  - 같은 DB에서는 한 번에 한 문장만 실행한다(DB마다 세션 1개).
  - 정렬은 가져온 행 안에서만 한다.
  - 작업 영역은 SQL 탭을 하나 이상 둔다(탭이 하나면 닫기 메뉴는 모두 꺼짐, "모두 닫기"는 두지 않음).
tests:
  - tests/MyPlugin.Tests/WorkspaceLogicTests.cs
  - tests/MyPlugin.Tests/EditorLogicTests.cs
  - tests/MyPlugin.Tests/SqlFileLogicTests.cs
  - tests/MyPlugin.Tests/SqlDraftLogicTests.cs
  - tests/MyPlugin.Tests/SqlScriptTests.cs
related: [find-bar, result-grid, result-edit-bar, result-message-list, result-history-list, dialogs]
